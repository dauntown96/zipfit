# DB 스키마·함수 변경 — PR 병합 = 적용 (2026-09-30 신설 · 우편함 「운영 — DB 함수·스키마 변경도 PR 병합 = 적용」)
# 🔴 Claude Code는 supabase/migrations/ 에 SQL을 쓰고 PR을 병합할 뿐, 운영 DB에 DDL을 직접 보내지 않는다. 규칙 정본: supabase/migrations/README.md
# PR   → check: 모든 PR 에서 돈다(2026-09-30). DB 파일을 건드린 PR 만 아직 적용 안 된 파일을 되돌리기 전용 트랜잭션으로 실제 DB에서 돌린다(전·후 스키마 지문이 같아야 초록) — 나머지는 「해당 없음」으로 즉시 통과.
#        🔴 빨간 체크의 PR은 병합하지 않는다.
# main → apply: 아직 적용 안 된 파일만 파일마다 한 트랜잭션으로 적용하고 zipfit_ops.schema_migrations 에 같은 트랜잭션으로 기록한다.
#        같은 커밋을 다시 돌려도(workflow_dispatch) 기록된 파일은 건너뛴다. 실패하면 라벨 db-apply 이슈(통과하면 스스로 닫힌다).
# 비밀값: 기존 Actions Secret SUPABASE_ACCESS_TOKEN 하나. 새 비밀값 0.
name: DB migrations

on:
  # 🔵 2026-09-30 — PR 에는 경로 필터를 두지 않는다. `check` 를 main 필수 체크로 걸 수 있게 모든 PR 에서 결과를 낸다
  #    (경로 필터가 있으면 DB 파일을 안 건드린 PR 에는 check 가 아예 생기지 않아 필수 체크가 영영 기다린다 — PR #278 실측).
  #    DB 파일(아래 check 잡의 DB_PATHS)을 안 건드린 PR 은 첫 단계가 「해당 없음」으로 끝내 DB 를 부르지 않는다.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: db-check-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: DB 파일을 건드렸나
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # DB 파일 = 종전 pull_request.paths 다섯 경로
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          hits=$(printf '%s\n' "$changed" | grep -E '^(supabase/migrations/|supabase/rpc/|supabase/invariants/|\.github/db/|\.github/workflows/db-migrations\.yml$)' || true)
          if [ -n "$hits" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            printf 'DB 파일 변경:\n%s\n' "$hits"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "## DB 변경 PR 체크 — 해당 없음" >> "$GITHUB_STEP_SUMMARY"
            echo "DB 파일(supabase/migrations · supabase/rpc · supabase/invariants · .github/db · 이 워크플로) 변경 없음 — DB 를 부르지 않고 통과." >> "$GITHUB_STEP_SUMMARY"
            echo "해당 없음 — DB 파일 변경 없음(바뀐 파일 $(printf '%s\n' "$changed" | grep -c . )개)"
          fi
      - name: 되돌리기 전용 체크
        if: steps.scope.outputs.relevant == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/db/migrate.py check
      - name: 결과 올리기
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-result
          path: db-result.json
          retention-days: 30

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: db-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: 적용 — 아직 기록 안 된 파일만
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/db/migrate.py apply
      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-result
          path: db-result.json
          retention-days: 90
      - name: 알림(이슈 열기·닫기)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/health/issue.sh db-apply "[DB 적용] 병합 뒤 DB 변경 적용 실패"
