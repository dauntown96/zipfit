# DB 스키마·함수 변경 — PR 병합 = 적용 (2026-09-30 신설 · 우편함 「운영 — DB 함수·스키마 변경도 PR 병합 = 적용」)
# 🔴 Claude Code는 supabase/migrations/ 에 SQL을 쓰고 PR을 병합할 뿐, 운영 DB에 DDL을 직접 보내지 않는다. 규칙 정본: supabase/migrations/README.md
# PR   → check: 모든 PR 에서 돈다(2026-09-30). DB 파일을 건드린 PR 만 아직 적용 안 된 파일을 되돌리기 전용 트랜잭션으로 실제 DB에서 돌린다(전·후 스키마 지문이 같아야 초록) — 나머지는 「해당 없음」으로 즉시 통과.
#        🔴 빨간 체크의 PR은 병합하지 않는다.
# main → apply: 아직 적용 안 된 파일만 파일마다 한 트랜잭션으로 적용하고 zipfit_ops.schema_migrations 에 같은 트랜잭션으로 기록한다.
#        같은 커밋을 다시 돌려도(workflow_dispatch) 기록된 파일은 건너뛴다. 실패하면 라벨 db-apply 이슈(통과하면 스스로 닫힌다).
# 비밀값: 기존 Actions Secret SUPABASE_ACCESS_TOKEN 하나. 새 비밀값 0.
name: DB migrations

on:
  # 🔵 2026-09-30 — PR 에는 경로 필터를 두지 않는다. `check` 를 main 필수 체크로 걸 수 있게 모든 PR 에서 결과를 낸다
  #    (경로 필터가 있으면 DB 파일을 안 건드린 PR 에는 check 가 아예 생기지 않아 필수 체크가 영영 기다린다 — PR #278 실측).
  #    DB 파일(아래 check 잡 「DB 파일을 건드렸나」 단계의 grep 다섯 경로)을 안 건드린 PR 은 첫 단계가 「해당 없음」으로 끝내 DB 를 부르지 않는다.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    # 🔵 2026-11-12(우편함 「코드·운영 — Visual 갱신 뒤 승인 멈춤 안 C 시험 …」 1) — mode=check: 그 가지(ref)에서 check 잡만 돈다(apply 0).
    #    봇(GITHUB_TOKEN)이 민 커밋(Visual 기준 갱신)에는 PR 실행이 승인 대기로 멈춰 필수 체크 check 가 새 head 에 없었다(#994 3cfdf6e).
    #    visual.yml 이 기준 커밋 뒤 이 워크플로를 그 가지로 dispatch 한다 — dispatch 는 GITHUB_TOKEN 으로도 돈다.
    inputs:
      mode:
        description: 'check = 가지에서 PR 체크만(apply 0) · 비우면 종전(main apply 재실행)'
        required: false
        default: ''
      pr_number:
        description: 'mode=check 일 때 — 그 가지의 PR 번호(기준 sha 를 PR 에서 읽는다)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  check:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'check')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: db-check-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 기준 sha — PR 실행은 이벤트 값 · dispatch(mode=check)는 PR 번호로 읽는다(그 PR head = 이 가지 head 여야 한다 · 아니면 실패).
      - name: 기준 sha
        env:
          GH_TOKEN: ${{ github.token }}
          EV_BASE: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [ -n "$EV_BASE" ]; then echo "BASE_SHA=$EV_BASE" >> "$GITHUB_ENV"; exit 0; fi
          [ -n "$PR_NUMBER" ] || { echo "::error::mode=check 에는 pr_number 가 필요하다"; exit 1; }
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          base=$(printf '%s' "$pr" | python3 -c 'import json,sys; print(json.load(sys.stdin)["base"]["sha"])')
          head=$(printf '%s' "$pr" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])')
          [ "$head" = "$(git rev-parse HEAD)" ] || { echo "::error::PR #${PR_NUMBER} head $head ≠ 이 가지 head $(git rev-parse HEAD)"; exit 1; }
          git fetch -q origin "$base" 2>/dev/null || true
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "dispatch check — PR #${PR_NUMBER} 기준 ${base:0:7} · head ${head:0:7}" | tee -a "$GITHUB_STEP_SUMMARY"
      # 🔵 2026-10-30(우편함 「코드·운영 — #762 DB 묶음 병합」 덧 · #785) — PR 이 새로 더한 .md 줄의 {{ · {% (Pages Jekyll Liquid 빌드 실패 꼴). DB 를 부르지 않는다.
      - name: Pages Liquid 글자
        # BASE_SHA = 「기준 sha」 단계(GITHUB_ENV)
        run: bash scripts/pages-liquid-check.sh
      # 🔵 2026-10-13(우편함 「코드 — 카드 머리 세대수」 0장 2) — CLAUDE.md 「최근 작업 이력」 꼴(그 절 머리 아래 표 한 벌 · 3행 · 행당 600B · 최신부터).
      #    검사는 .claude/hooks/rule-check.py 의 history_problems() 한 벌(커밋 훅과 같은 함수 · 표준 라이브러리만 · DB 를 부르지 않는다).
      #    처음 한 주는 경고만 — HISTORY_FAIL_FROM(KST 날짜)부터는 같은 문제를 실패로 낸다. 날짜를 옮기려면 이 값 한 줄만 고친다.
      - name: CLAUDE.md 이력 표 꼴
        env:
          HISTORY_FAIL_FROM: '2026-10-20'
        # 🔵 2026-10-18(우편함 「G8 확정 고침」 7) — 표 칸 수도 본다(CLAUDE.md · docs/history.md — 셀 안 `|` 는 `\|` · 행 끝 `|`). 같은 경고→실패 날짜를 따른다.
        run: |
          a=0; b=0
          o1=$(python3 .claude/hooks/rule-check.py --history CLAUDE.md 2>&1) || a=1
          o2=$(python3 .claude/hooks/rule-check.py --table-cols CLAUDE.md docs/history.md 2>&1) || b=1
          out=$(printf '%s\n%s\n' "$o1" "$o2" | sed '/^$/d')
          if [ "$a" = 0 ] && [ "$b" = 0 ]; then
            echo "CLAUDE.md 「최근 작업 이력」 꼴 · 표 칸 수 — 통과"; exit 0
          fi
          printf '%s\n' "$out"
          today=$(TZ=Asia/Seoul date +%F)
          if [ "$today" \< "$HISTORY_FAIL_FROM" ]; then
            printf '%s\n' "$out" | while IFS= read -r l; do echo "::warning::$l"; done
            echo "경고만 — $HISTORY_FAIL_FROM(KST)부터 실패"; exit 0
          fi
          printf '%s\n' "$out" | while IFS= read -r l; do echo "::error::$l"; done
          exit 1
      # 🔵 2026-10-29(우편함 「코드·운영 — 런칭 전날」 2) — index.html · sw.js 를 바꾼 PR 은 head CACHE_NAME = base + 1(원칙 9). 두 파일을 안 건드리면 건너뜀.
      #    DB 를 부르지 않는다 · scripts/ 파일이라 아래 「DB 파일을 건드렸나」의 다섯 경로에 들지 않는다.
      - name: CACHE 판(+1)
        # BASE_SHA = 「기준 sha」 단계(GITHUB_ENV)
        run: bash scripts/cache-bump-check.sh
      # 🔵 2026-11-04(우편함 「코드·운영 — #732 지방공사 받기 …」 6 ② · 백로그 「네트워크 허용 문서가 낡았고 … 「{{」를 막는 PR 검사가 없다」) —
      #    고지 문서(privacy.html · terms.html · notices.json)에 자리 표시 「{{」가 남은 채 main 으로 가면 실패. DB 를 부르지 않는다(grep 한 줄).
      - name: 고지 문서 자리 표시 「{{」
        run: |
          hits=$(grep -n '{{' privacy.html terms.html notices.json 2>/dev/null || true)
          if [ -z "$hits" ]; then echo "고지 문서 자리 표시 「{{」 0 — 통과"; exit 0; fi
          printf '%s\n' "$hits" | while IFS= read -r l; do echo "::error::자리 표시가 남았다 — $l"; done
          exit 1
      - name: DB 파일을 건드렸나
        id: scope
        # BASE_SHA = 「기준 sha」 단계(GITHUB_ENV)
        run: |
          # DB 파일 = 종전 pull_request.paths 다섯 경로
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          hits=$(printf '%s\n' "$changed" | grep -E '^(supabase/migrations/|supabase/rpc/|supabase/invariants/|\.github/db/|\.github/workflows/db-migrations\.yml$)' || true)
          # 🔵 2026-10-08(우편함 「코드 — 운영 기반 후속」 4 · 판정 ⓑ) — 이 워크플로 파일이 바뀌었어도 바뀐 줄이 전부 액션 판 올림(`uses:` 줄)이면
          #    DB 를 부르지 않는다. Dependabot 이 연 PR 의 실행에는 Actions 비밀값이 실리지 않아 DB 체크가 401 로 빨갛게 됐다(#406).
          #    DB 파일(마이그레이션·사본·불변식·스크립트)이 함께 바뀌었으면 종전대로 해당 있음이다.
          if printf '%s\n' "$hits" | grep -qx '\.github/workflows/db-migrations\.yml'; then
            other=$(git diff -U0 "$BASE_SHA"...HEAD -- .github/workflows/db-migrations.yml | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' | grep -vE '^[-+][[:space:]]*(-[[:space:]]+)?uses:[[:space:]]' || true)
            if [ -z "$other" ]; then
              hits=$(printf '%s\n' "$hits" | grep -vx '\.github/workflows/db-migrations\.yml' || true)
              echo "이 워크플로의 바뀐 줄이 전부 uses: 판 올림이다 — DB 파일 변경으로 세지 않는다"
            fi
          fi
          if [ -n "$hits" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            printf 'DB 파일 변경:\n%s\n' "$hits"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "## DB 변경 PR 체크 — 해당 없음" >> "$GITHUB_STEP_SUMMARY"
            echo "DB 파일(supabase/migrations · supabase/rpc · supabase/invariants · .github/db · 이 워크플로) 변경 없음 — DB 를 부르지 않고 통과." >> "$GITHUB_STEP_SUMMARY"
            echo "해당 없음 — DB 파일 변경 없음(바뀐 파일 $(printf '%s\n' "$changed" | grep -c . )개)"
          fi
      - name: 되돌리기 전용 체크
        if: steps.scope.outputs.relevant == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # BASE_SHA 는 「기준 sha」 단계가 GITHUB_ENV 에 둔다 — 불변식 파일만 바꾼 PR 을 가리려고(migrate.py changed_invariants)
        run: python3 .github/db/migrate.py check
      - name: 결과 올리기
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: db-result
          path: db-result.json
          retention-days: 30

  apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && inputs.mode != 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: db-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: 적용 — 아직 기록 안 된 파일만
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 .github/db/migrate.py apply
      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: db-result
          path: db-result.json
          retention-days: 90
      - name: 알림(이슈 열기·닫기)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/health/issue.sh db-apply "[DB 적용] 병합 뒤 DB 변경 적용 실패"
