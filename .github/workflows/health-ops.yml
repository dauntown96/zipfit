# B. 운영 건강 점검 — 사람 손 없이 도는가(2026-09-29 신설 · 우편함 「화면 점검·운영 건강 점검 자동화」)
# ⑦ 함수 정의 = supabase/rpc/ 사본(2026-09-30 · 우편함 「운영 — 함수 사본 드리프트」) — 체크아웃한 사본과 DB md5 를 읽기만 해서 대조한다.
# 🔴 읽기·알림만 한다. DB 는 관리 API 로 읽되 모든 SQL 이 `set transaction read only` 안에서 돈다(.github/health/lib.mjs).
#    예외 하나(2026-10-06 · 1-B 6): 경고·실패를 public.ops_health_record(jsonb) 한 함수로 ops_health_findings 에 남긴다(30일).
# 비밀값: 기존 Actions Secret SUPABASE_ACCESS_TOKEN 하나 · 공개 anon 키. 새 비밀값 0.
# 알림: 실패면 라벨 health-ops 이슈를 하나 열고(열려 있으면 댓글), 통과하면 스스로 닫는다(.github/health/issue.sh).
#   🔵 2026-10-15(관문 항목별) — 루틴을 멈추는 실패(.github/health/gate.mjs HARD)만 health-ops · 나머지는 health-ops-soft(루틴 v2.6 이 보지 않는다).
name: Health — Ops (B)

on:
  # 🔵 2026-10-03(#328) — 30분 주기 정본은 GitHub 밖이다: Supabase pg_cron `zipfit-health-ops-dispatch`(25·55분)가
  #    ops_health_dispatch() 로 이 워크플로를 workflow_dispatch 로 부른다(마이그레이션 2026-10-02_05 · Vault github_actions_dispatch_token).
  #    GitHub schedule 은 하루 몇 번만 돌았다(25·55분 설정 · 10-02 08:39Z 뒤 14:5xZ까지 0회) — 그래서 예비로만 2시간마다 40분에 둔다
  #    (pg_cron 경로가 죽었을 때 ops_dispatch 점검이 실패로 알리게 하는 자리).
  #    🔵 2026-11-21(우편함 「코드·운영 — 둘째 묶음」 A) — 예비는 늦게 뜬다(12:40Z 자리가 12:57Z에 떠 12:55Z 발송 회차와 2분 차로 이어 돎 ·
  #    run 44906244112 · 44906420669). 그래서 아래 관문(gate)이 schedule 실행만 「40분 안에 workflow_dispatch 회차가 시작됐으면 건너뜀」.
  #    pg_cron 이 멈춘 날은 dispatch 회차가 없어 예비가 그대로 돈다(보험은 남는다).
  schedule:
    - cron: '40 */2 * * *'
  workflow_dispatch:
    inputs:
      simulate:
        description: '알림 경로 시험 — fail 이면 안 멈추는 실패 점검 하나를(health-ops-soft) · fail_hard 면 멈추는 실패 점검 하나를(health-ops) 일부러 더한다 · gap 이면 직전 점검 뒤 경과에 180분을 더한다 · runner 면 DB 점검을 처음에 끊는다(점검 불능 — health-ops-blind) · sec 면 보안 권고 허용 목록에서 한 줄을 뺀다(⚠️ 시험) · notify 면 제목 「시험 — 알림 확인」 이슈를 연다(휴대폰 알림 시험) · dispatch_bad 면 「24시간 안 204 아닌 발송」에 가짜 한 줄을 더한다(⚠️ 시험) · rent5 면 「월 = 보증금 × 5%」 점검이 닫힌 공고를 열린 것으로 친다(걸린 행이 0 이면 가짜 한 줄 — ⚠️ 시험 · 안 멈춤이라 이슈는 열지 않는다)'
        type: choice
        options: [none, fail, fail_hard, gap, runner, sec, notify, dispatch_bad, rent5]
        default: none

permissions:
  contents: read
  issues: write
  actions: read   # 관문이 이 워크플로의 최근 실행을 읽는다

concurrency:
  group: health-ops
  cancel-in-progress: false

jobs:
  # 🔵 2026-11-21 — 예비 schedule 관문. dispatch·수동 실행은 늘 돈다.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          run=true; why=''
          if [ "$EVENT" = "schedule" ]; then
            last=$(gh api "repos/${{ github.repository }}/actions/workflows/health-ops.yml/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].created_at' 2>/dev/null || true)
            if [ -n "$last" ] && [ "$last" != "null" ]; then
              age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
              if [ "$age" -lt 2400 ]; then run=false; why="workflow_dispatch 회차가 $((age / 60))분 전에 시작됨($last) — 예비 건너뜀"; fi
            else
              why='dispatch 회차를 읽지 못함 — 예비 그대로 돎'
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT → run=$run $why"
  ops:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: 점검
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SIMULATE: ${{ inputs.simulate || 'none' }}
        run: node .github/health/ops-check.mjs
      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: health-result
          path: health-result.json
          retention-days: 14
      - name: 알림(이슈 열기·닫기)
        # 🔵 2026-09-30 — main 에서만 이슈를 연다·닫는다. 가지에서 수동 실행(검사 시험)은 결과만 남긴다.
        # 🔵 2026-10-06(1-C 2) — 가지에서는 DRY_RUN=1 로 판정·라벨 계산만 찍는다(GitHub 에 쓰지 않는다).
        #    「점검 실행」(runner)만 실패 = 점검 불능 → 라벨 health-ops-blind(루틴은 막지 않음) · 6시간 넘으면 health-ops 라벨을 더해 승격.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
          ISSUE_TITLE: ${{ inputs.simulate == 'notify' && '[자동 점검 B] 시험 — 알림 확인' || '[자동 점검 B] 운영 건강 점검 실패' }}
        run: bash .github/health/issue.sh health-ops "$ISSUE_TITLE" health-ops-blind "[자동 점검 B] 점검 불능 — 점검 도구가 못 돌았다(루틴은 막지 않음)" health-ops-soft "[자동 점검 B] 운영 점검 실패 — 루틴은 막지 않음(수집·화면·발송 등)"
