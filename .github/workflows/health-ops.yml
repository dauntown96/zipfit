# B. 운영 건강 점검 — 사람 손 없이 도는가(2026-09-29 신설 · 우편함 「화면 점검·운영 건강 점검 자동화」)
# ⑦ 함수 정의 = supabase/rpc/ 사본(2026-09-30 · 우편함 「운영 — 함수 사본 드리프트」) — 체크아웃한 사본과 DB md5 를 읽기만 해서 대조한다.
# 🔴 읽기·알림만 한다. DB 는 관리 API 로 읽되 모든 SQL 이 `set transaction read only` 안에서 돈다(.github/health/lib.mjs).
#    예외 하나(2026-10-06 · 1-B 6): 경고·실패를 public.ops_health_record(jsonb) 한 함수로 ops_health_findings 에 남긴다(30일).
# 비밀값: 기존 Actions Secret SUPABASE_ACCESS_TOKEN 하나 · 공개 anon 키. 새 비밀값 0.
# 알림: 실패면 라벨 health-ops 이슈를 하나 열고(열려 있으면 댓글), 통과하면 스스로 닫는다(.github/health/issue.sh).
name: Health — Ops (B)

on:
  # 🔵 2026-10-03(#328) — 30분 주기 정본은 GitHub 밖이다: Supabase pg_cron `zipfit-health-ops-dispatch`(25·55분)가
  #    ops_health_dispatch() 로 이 워크플로를 workflow_dispatch 로 부른다(마이그레이션 2026-10-02_05 · Vault github_actions_dispatch_token).
  #    GitHub schedule 은 하루 몇 번만 돌았다(25·55분 설정 · 10-02 08:39Z 뒤 14:5xZ까지 0회) — 그래서 예비로만 2시간마다 40분에 둔다
  #    (pg_cron 경로가 죽었을 때 ops_dispatch 점검이 실패로 알리게 하는 자리).
  schedule:
    - cron: '40 */2 * * *'
  workflow_dispatch:
    inputs:
      simulate:
        description: '알림 경로 시험 — fail 이면 실패 점검 하나를 일부러 더한다 · gap 이면 직전 점검 뒤 경과에 180분을 더한다 · runner 면 DB 점검을 처음에 끊는다(점검 불능 — health-ops-blind) · sec 면 보안 권고 허용 목록에서 한 줄을 뺀다(⚠️ 시험) · notify 면 제목 「시험 — 알림 확인」 이슈를 연다(휴대폰 알림 시험)'
        type: choice
        options: [none, fail, gap, runner, sec, notify]
        default: none

permissions:
  contents: read
  issues: write
  actions: read   # ops_gap — 이 워크플로의 직전 실행 시각을 읽는다(2026-10-02)

concurrency:
  group: health-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 점검
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SIMULATE: ${{ inputs.simulate || 'none' }}
          GH_API_TOKEN: ${{ github.token }}
        run: node .github/health/ops-check.mjs
      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-result
          path: health-result.json
          retention-days: 14
      - name: 알림(이슈 열기·닫기)
        # 🔵 2026-09-30 — main 에서만 이슈를 연다·닫는다. 가지에서 수동 실행(검사 시험)은 결과만 남긴다.
        # 🔵 2026-10-06(1-C 2) — 가지에서는 DRY_RUN=1 로 판정·라벨 계산만 찍는다(GitHub 에 쓰지 않는다).
        #    「점검 실행」(runner)만 실패 = 점검 불능 → 라벨 health-ops-blind(루틴은 막지 않음) · 6시간 넘으면 health-ops 라벨을 더해 승격.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ github.ref != 'refs/heads/main' && '1' || '' }}
          ISSUE_TITLE: ${{ inputs.simulate == 'notify' && '[자동 점검 B] 시험 — 알림 확인' || '[자동 점검 B] 운영 건강 점검 실패' }}
        run: bash .github/health/issue.sh health-ops "$ISSUE_TITLE" health-ops-blind "[자동 점검 B] 점검 불능 — 점검 도구가 못 돌았다(루틴은 막지 않음)"
