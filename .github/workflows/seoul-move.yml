# 일회용 — Supabase 서울 이전(싱가포르 → 서울) 덤프 · 복원 · 비교(2026-11-20 · 우편함 「코드·운영 — 서울 이전 ②′ Actions 길」).
# 정본 절차: docs/supabase-seoul-move.md 3장(3·4·5) · 비교 SQL = scripts/seoul-move-compare.sql(5장 ①②③ + ④).
# 이 컨테이너(Claude Code)는 Postgres 5432 를 실어 나르지 못해(프록시) Actions 에서 돈다.
#
# mode=dry : 옛 DB 덤프 셋만(새 DB 쓰기 0) — 연결 · 버전 · 권한 · 크기 시험 + 두 DB 사전 조사 + 옛 DB 비교 SQL.
# mode=run : 옛 cron active 0 확인(아니면 실패) → 덤프 셋 → 새 DB 가 비었는지 확인 → 확장 켬 → 한 트랜잭션 복원
#            → (따로) pgsodium 루트 키 · Vault 옮김 시도(실패해도 계속 — Vault 7 은 다운님 ⑧) → 비교 SQL 옛 · 새 → 같음/다름.
# mode=self : 새 DB zipfit_ops.project_self 한 행을 새 ref · 새 anon 키(supabase/public-anon-key.txt — 전환 PR 병합 뒤 main 값)로(요청서 6 첫 줄).
# mode=cron : 새 DB에 docs/cron-jobs.sql(새 잡은 켜진 채 만들어진다 — EF 배포 뒤에만) → 옛 DB와 jobname · schedule · command md5 대조.
#   (이 세션의 관리 API 토큰은 새 프로젝트에 403 — 2026-11-20 실측 · 그래서 self · cron 도 이 워크플로가 psql 로 한다)
# 🔴 출력은 표 이름 · 수 · md5 만. 연결 문자열 · 값 · 덤프 파일은 찍지도 올리지도 않는다(개인정보 표가 덤프에 있다 — 원칙 36).
#    psql 오류는 「파일:줄 · 오류 첫 줄」만, 괄호 속 값은 가린다(COPY 데이터 줄 · 키 값이 로그로 새지 않게).
# 쓰는 비밀값: MOVE_OLD_DB_URL · MOVE_NEW_DB_URL(세션 풀러 5432 — 이전 끝나면 다운님이 지운다) · SUPABASE_ACCESS_TOKEN(pgsodium 키만).
# 이전이 끝나면 이 파일은 지운다(일회용).
name: Seoul move (one-off)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = 덤프·조사만 · run = 옛 cron 꺼짐 확인 뒤 복원·비교 · self = 새 DB project_self 한 행 · cron = 새 DB에 docs/cron-jobs.sql + 옛과 대조'
        type: choice
        options: [dry, run, self, cron]
        default: dry

permissions:
  contents: read

concurrency:
  group: seoul-move
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OLD: ${{ secrets.MOVE_OLD_DB_URL }}
      NEW: ${{ secrets.MOVE_NEW_DB_URL }}
      MODE: ${{ inputs.mode }}
      OLD_REF: khdpjjyspmlqtzperoqg
      NEW_REF: neuaeexdxfkkcvyzsicb
      PGCONNECT_TIMEOUT: '20'
    steps:
      - uses: actions/checkout@v7

      - name: 비밀값 있음 확인(값은 찍지 않음)
        run: |
          set -euo pipefail
          [ -n "$OLD" ] || { echo "::error::MOVE_OLD_DB_URL 없음"; exit 1; }
          [ -n "$NEW" ] || { echo "::error::MOVE_NEW_DB_URL 없음"; exit 1; }
          case "$OLD" in *"$OLD_REF"*) echo "OLD 에 옛 ref 있음";; *) echo "::error::MOVE_OLD_DB_URL 에 옛 ref($OLD_REF)가 없다 — 둘이 바뀌었나"; exit 1;; esac
          case "$NEW" in *"$NEW_REF"*) echo "NEW 에 새 ref 있음";; *) echo "::error::MOVE_NEW_DB_URL 에 새 ref($NEW_REF)가 없다 — 둘이 바뀌었나"; exit 1;; esac

      - name: PostgreSQL 17 클라이언트(zipfit-backup backup.yml 과 같은 단계)
        run: |
          set -euo pipefail
          retry() {
            local name="$1"; shift; local n=1
            while true; do
              local rc=0; "$@" || rc=$?
              if [ "$rc" -eq 0 ]; then echo "OK: $name (시도 $n)"; return 0; fi
              echo "::warning::$name 실패 — 시도 $n/4 · 종료 코드 $rc"
              if [ "$n" -ge 4 ]; then echo "::error::$name 4번 모두 실패"; return "$rc"; fi
              sleep $((15 * n)); n=$((n + 1))
            done
          }
          KEY=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          get_key() {
            sudo curl -fsSL --connect-timeout 20 --max-time 60 -o "$KEY" https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              || sudo curl -fsSL --connect-timeout 20 --max-time 60 -o "$KEY" https://apt.postgresql.org/pub/repos/apt/ACCC4CF8.asc
          }
          sudo install -d /usr/share/postgresql-common/pgdg
          retry "서명 키 받기" get_key
          echo "deb [signed-by=$KEY] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          retry "apt-get update" sudo apt-get update -qq
          retry "apt-get install postgresql-client-17" sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: 사전 조사(읽기 · 두 DB)
        run: |
          set -uo pipefail
          pg_dump --version
          echo "### 옛 DB"; psql "$OLD" -X -q -v ON_ERROR_STOP=0 -f scripts/seoul-move-info.sql 2>&1 | sed -E 's/=\([^)]*\)/=(…)/g'
          echo "### 새 DB"; psql "$NEW" -X -q -v ON_ERROR_STOP=0 -f scripts/seoul-move-info.sql 2>&1 | sed -E 's/=\([^)]*\)/=(…)/g'

      - name: 옛 cron 꺼짐 확인(run 만)
        if: inputs.mode == 'run'
        run: |
          set -euo pipefail
          n=$(psql "$OLD" -X -Atc "select count(*) from cron.job where active")
          echo "옛 cron active = $n"
          [ "$n" = "0" ] || { echo "::error::옛 cron 이 아직 켜져 있다($n) — 요청서 2(옛 cron 32 끔)를 먼저"; exit 1; }

      - name: 덤프 셋(roles · schema · data)
        if: inputs.mode == 'dry' || inputs.mode == 'run'
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/move"; mkdir -p "$D"; chmod 700 "$D"
          redact() { sed -E 's/=\([^)]*\)/=(…)/g; /^(CONTEXT|DETAIL|LINE)/d' | head -20; }
          # roles — 우리가 만든 역할이 0이면 비운다(관리형 역할은 새 프로젝트에 이미 있다)
          custom=$(psql "$OLD" -X -Atc "select count(*) from pg_roles where rolname !~ '^(pg_|supabase|pgsodium)' and rolname not in ('postgres','anon','authenticated','service_role','authenticator','dashboard_user','pgbouncer','cli_login_postgres')")
          echo "우리가 만든 역할 = $custom"
          if [ "$custom" != "0" ]; then echo "::error::관리형 밖 역할 $custom 개 — roles 덤프를 거르는 규칙이 필요하다(사전 조사 목록 참고) · 멈춤"; exit 1; fi
          echo "-- roles: 관리형 밖 역할 0 (2026-11-20 확인)" > "$D/roles.sql"
          # schema — public · zipfit_ops · 소유자는 복원하는 postgres 로(--no-owner) · 권한(ACL)은 그대로 싣는다
          pg_dump "$OLD" --schema-only --schema=public --schema=zipfit_ops --no-owner -f "$D/schema.raw.sql" 2> "$D/e1" || { redact < "$D/e1"; exit 1; }
          # 관리형 자리 걸러냄(supabase db dump 와 같은 축): public 스키마 만들기 · supabase_admin 기본 권한(postgres 가 못 바꾼다)
          sed -E '/^CREATE SCHEMA public;$/d; /^COMMENT ON SCHEMA public /d; /^ALTER DEFAULT PRIVILEGES FOR ROLE "?supabase_admin"? /d' "$D/schema.raw.sql" > "$D/schema.sql"
          echo "걸러낸 줄 = $(( $(wc -l < "$D/schema.raw.sql") - $(wc -l < "$D/schema.sql") ))"
          # data — 우리 두 스키마 + auth 사용자 두 표(세션·토큰은 옮기지 않는다 — 서명 키가 달라 어차피 다시 로그인)
          pg_dump "$OLD" --data-only --schema=public --schema=zipfit_ops -f "$D/data.sql" 2> "$D/e2" || { redact < "$D/e2"; exit 1; }
          pg_dump "$OLD" --data-only --table=auth.users --table=auth.identities -f "$D/data_auth.sql" 2> "$D/e3" || { redact < "$D/e3"; exit 1; }
          for f in roles schema data data_auth; do
            printf '%-10s %10s B  %6s 줄\n' "$f" "$(stat -c %s "$D/$f.sql")" "$(wc -l < "$D/$f.sql")"
          done
          echo "CREATE TABLE = $(grep -c '^CREATE TABLE' "$D/schema.sql") · CREATE FUNCTION = $(grep -cE '^CREATE (OR REPLACE )?FUNCTION' "$D/schema.sql") · POLICY = $(grep -c '^CREATE POLICY' "$D/schema.sql") · COPY(data) = $(grep -c '^COPY ' "$D/data.sql") · COPY(auth) = $(grep -c '^COPY ' "$D/data_auth.sql")"
          echo "ALTER DEFAULT PRIVILEGES 남은 줄 = $(grep -c '^ALTER DEFAULT PRIVILEGES' "$D/schema.sql" || true)"
          grep -oE '^ALTER DEFAULT PRIVILEGES FOR ROLE [^ ]+' "$D/schema.sql" | sort | uniq -c || true

      - name: 비교 SQL — 옛 DB(dry 는 SQL 시험)
        if: inputs.mode == 'dry' || inputs.mode == 'run'
        run: |
          set -euo pipefail
          psql "$OLD" -X -q -v ON_ERROR_STOP=1 -f scripts/seoul-move-compare.sql > "$RUNNER_TEMP/cmp_old.txt" 2> "$RUNNER_TEMP/ce" || { sed -E 's/=\([^)]*\)/=(…)/g' "$RUNNER_TEMP/ce" | head; exit 1; }
          cat "$RUNNER_TEMP/cmp_old.txt"

      - name: 새 DB 비었나 · 확장 켬 · 복원(run 만 · 한 트랜잭션)
        if: inputs.mode == 'run'
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/move"
          n=$(psql "$NEW" -X -Atc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname in ('public','zipfit_ops') and relkind in ('r','v','m','S')")
          echo "새 DB public·zipfit_ops 객체 = $n"
          [ "$n" = "0" ] || { echo "::error::새 DB 가 비어 있지 않다($n) — 복원하지 않는다"; exit 1; }
          psql "$NEW" -X -q -v ON_ERROR_STOP=1 -c "create extension if not exists pg_cron" -c "create extension if not exists pg_net with schema extensions" \
            -Atc "select string_agg(extname||' '||extversion, ' · ' order by extname) from pg_extension"
          set +e
          psql "$NEW" -X -q --single-transaction -v ON_ERROR_STOP=1 \
            -f "$D/roles.sql" -f "$D/schema.sql" \
            -c 'SET session_replication_role = replica' \
            -f "$D/data.sql" -f "$D/data_auth.sql" > /dev/null 2> "$D/er"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::복원 실패(rc=$rc) — 한 트랜잭션이라 새 DB 에 남은 것 0"
            grep -E 'ERROR' "$D/er" | sed -E 's/=\([^)]*\)/=(…)/g' | cut -c1-300 | head -5
            exit 1
          fi
          echo "복원 끝(rc=0) · 경고 줄 $(grep -c WARNING "$D/er" || true)"

      - name: pgsodium 루트 키 · Vault 옮김 시도(run 만 · 실패해도 계속)
        if: inputs.mode == 'run'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          api=https://api.supabase.com/v1/projects
          key=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$api/$OLD_REF/pgsodium" | python3 -c 'import json,sys; print(json.load(sys.stdin)["root_key"])')
          echo "::add-mask::$key"
          body=$(python3 -c 'import json,sys; print(json.dumps({"root_key": sys.argv[1]}))' "$key")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "$body" "$api/$NEW_REF/pgsodium")
          echo "PUT pgsodium = $code"
          [ "$code" = "200" ] || [ "$code" = "201" ] || { echo "::warning::pgsodium 키를 옮기지 못함 — Vault 7 은 다운님 ⑧(다시 넣기)"; exit 1; }
          D="$RUNNER_TEMP/move"
          pg_dump "$OLD" --data-only --table=vault.secrets -f "$D/vault.sql" 2>/dev/null
          psql "$NEW" -X -q --single-transaction -v ON_ERROR_STOP=1 -f "$D/vault.sql" > /dev/null 2> "$D/ev" \
            || { echo "::warning::vault.secrets 옮김 실패 — 다운님 ⑧"; grep ERROR "$D/ev" | sed -E 's/=\([^)]*\)/=(…)/g' | cut -c1-200 | head -3; exit 1; }
          ok=$(psql "$NEW" -X -Atc "select count(*) from vault.decrypted_secrets where decrypted_secret is not null")
          echo "새 DB Vault 풀림 = $ok (값은 찍지 않음)"

      - name: 비교 SQL — 새 DB · 같음/다름(run 만)
        if: inputs.mode == 'run'
        run: |
          set -euo pipefail
          psql "$NEW" -X -q -v ON_ERROR_STOP=1 -f scripts/seoul-move-compare.sql > "$RUNNER_TEMP/cmp_new.txt" 2> "$RUNNER_TEMP/ce" || { sed -E 's/=\([^)]*\)/=(…)/g' "$RUNNER_TEMP/ce" | head; exit 1; }
          if diff -u "$RUNNER_TEMP/cmp_old.txt" "$RUNNER_TEMP/cmp_new.txt" > "$RUNNER_TEMP/cmp.diff"; then
            echo "✅ 비교 SQL ①~④ 옛 = 새"
            { echo "### 서울 이전 비교 — 옛 = 새"; echo '```'; cat "$RUNNER_TEMP/cmp_new.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::비교 SQL 다름 — 6(전환) 하지 않는다"
            cat "$RUNNER_TEMP/cmp.diff"
            { echo "### 서울 이전 비교 — 다름"; echo '```diff'; cat "$RUNNER_TEMP/cmp.diff"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### 참고(6 뒤 대조)"; psql "$NEW" -X -q -v ON_ERROR_STOP=0 -c "select (select count(*) from cron.job) cron_jobs, (select count(*) from vault.secrets) vault_secrets" 2>&1 | head -5

      - name: 새 DB project_self(self 만)
        if: inputs.mode == 'self'
        run: |
          set -euo pipefail
          key=$(tr -d '[:space:]' < supabase/public-anon-key.txt)
          ref=$(sed -nE 's/^project_id = "([a-z0-9]+)"$/\1/p' supabase/config.toml)
          [ "$ref" = "$NEW_REF" ] || { echo "::error::main 의 config.toml project_id($ref)가 새 ref 가 아니다 — 전환 PR 병합 뒤에 부른다"; exit 1; }
          payload=$(python3 -c 'import base64,json,sys; p=sys.argv[1].split(".")[1]; d=json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4))); print(d.get("ref"), d.get("role"))' "$key")
          echo "anon 키 속 = $payload"
          case "$payload" in "$NEW_REF anon") ;; *) echo "::error::public-anon-key.txt 가 새 프로젝트 anon 키가 아니다"; exit 1;; esac
          psql "$NEW" -X -q -v ON_ERROR_STOP=1 -v ref="$ref" -v key="$key" <<'SQL'
          update zipfit_ops.project_self set ref = :'ref', anon_key = :'key', updated_at = now();
          SQL
          psql "$NEW" -X -Atc "select count(*) || ' 행 · ref=' || string_agg(ref, ',') || ' · anon 키 길이=' || string_agg(length(anon_key)::text, ',') || ' · ops_project_url=' || public.ops_project_url() from zipfit_ops.project_self"

      - name: 새 DB cron — docs/cron-jobs.sql · 옛과 대조(cron 만)
        if: inputs.mode == 'cron'
        run: |
          set -euo pipefail
          r=$(psql "$NEW" -X -Atc "select ref from zipfit_ops.project_self")
          [ "$r" = "$NEW_REF" ] || { echo "::error::새 DB project_self.ref($r)가 새 ref 가 아니다 — self 먼저"; exit 1; }
          oa=$(psql "$OLD" -X -Atc "select count(*) from cron.job where active")
          [ "$oa" = "0" ] || { echo "::error::옛 cron active $oa — 두 곳 동시 실행 금지 · 옛 것을 먼저 끈다"; exit 1; }
          psql "$NEW" -X -q -v ON_ERROR_STOP=1 -f docs/cron-jobs.sql > /dev/null 2> "$RUNNER_TEMP/ec" || { grep ERROR "$RUNNER_TEMP/ec" | cut -c1-200 | head -5; exit 1; }
          Q="select jobname || ' | ' || schedule || ' | ' || md5(command) from cron.job order by jobname"
          psql "$OLD" -X -Atc "$Q" > "$RUNNER_TEMP/cron_old.txt"
          psql "$NEW" -X -Atc "$Q" > "$RUNNER_TEMP/cron_new.txt"
          echo "옛 $(wc -l < "$RUNNER_TEMP/cron_old.txt")잡 · 새 $(wc -l < "$RUNNER_TEMP/cron_new.txt")잡 · 새 active $(psql "$NEW" -X -Atc 'select count(*) from cron.job where active')"
          if diff -u "$RUNNER_TEMP/cron_old.txt" "$RUNNER_TEMP/cron_new.txt"; then echo "✅ cron 옛 = 새(이름 · 주기 · 명령 md5)"; else echo "::error::cron 다름 — 새 잡을 끈다"; psql "$NEW" -X -q -c "select cron.alter_job(jobid, active := false) from cron.job" > /dev/null; exit 1; fi

      - name: 덤프 지움
        if: always()
        run: rm -rf "$RUNNER_TEMP/move" "$RUNNER_TEMP"/cmp_* || true
