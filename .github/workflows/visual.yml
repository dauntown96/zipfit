# 시각 회귀 — 표본 카드 다섯 × 390/1280 × 밝음/어두움 × 접힘/펼침(40장)을 고정 대역 응답으로 그려 기준 그림과 견준다
# (2026-11-10 · 우편함 「코드·운영 — 시각 회귀 장치 …」 · 스크립트·규칙은 .github/health/visual.mjs 머리).
# 🔴 운영을 부르지 않는다(Supabase 요청 전부 고정본 · 지도·썸네일 막음) · DB 기록·이슈 0 · PR 체크로만 보인다.
# 언제: 화면 파일(index.html · sw.js · fonts/)이나 이 장치를 고친 PR · 수동.
#   매일 실행은 두지 않는다 — 고정본이 고정이라 같은 커밋은 같은 그림이다(바뀌는 것은 PR 로만 들어온다).
# 기준 갱신(의도한 모양 변경): 그 PR 가지에서 이 워크플로를 수동으로 update=true 로 돌린다 →
#   러너가 기준 그림 40장 · baseline.json(누가 · 언제 · 실행 주소 · 커밋)을 새로 쓰고 그 가지에 커밋한다. main 에서는 갱신하지 않는다(PR 로만).
# 첫 기준(baseline.json 이 아직 없을 때만): PR 실행이 기준을 만들어 그 가지에 커밋하고 견주기는 건너뛴다(통과 · 요약에 「첫 기준」).
#   새 워크플로는 main 에 들어가기 전에는 수동 실행(workflow_dispatch)이 안 되기 때문이다(2026-11-10 이 장치를 들인 PR 이 그 경우).
# 🔴 GITHUB_TOKEN 으로 민 커밋은 체크를 다시 돌리지 않는다 — 🔵 2026-11-11 부터 같은 실행이 기준 커밋 뒤 견주기를 한 번 더 돌려
#    새 head 커밋 상태 「Visual (갱신 뒤 견주기)」로 남긴다(사람 손 없이 PR 에 결과가 보인다).
name: Visual

on:
  pull_request:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'fonts/**'
      - '.github/health/visual.mjs'
      - '.github/health/visual/**'
      - '.github/workflows/visual.yml'
  workflow_dispatch:
    inputs:
      update:
        description: '기준 갱신 — true 면 이 가지의 기준 그림을 새로 쓰고 커밋한다(main 불가 · 의도한 모양 변경일 때만)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 기준을 쓸 때(첫 기준 · update=true) 그 가지에 커밋한다 — 같은 저장소 가지만(포크 PR 의 토큰은 읽기만이라 커밋 단계에서 실패한다).
    permissions:
      contents: write
      statuses: write   # 갱신 뒤 견주기 결과를 새 head 커밋 상태로 남긴다(아래 「갱신 뒤 견주기」)
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      WANT_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.update && github.ref != 'refs/heads/main' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Playwright · 그림 비교 준비
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          # 판을 고정한다 — 렌더러 판이 바뀌면 그림이 바뀐다(그때는 기준 갱신). health-screen 과 같은 Playwright 판.
          npm install --no-audit --no-fund playwright@1.55.0 pngjs@7.0.0 pixelmatch@5.3.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          ln -sfn "$RUNNER_TEMP/pw/node_modules" "$GITHUB_WORKSPACE/.github/health/node_modules"
      - name: 그리기 · (기준 쓰기 | 견주기)
        id: run
        run: |
          set +e
          mode=compare
          if [ "$WANT_UPDATE" = "1" ]; then mode=update
          elif [ ! -f .github/health/visual/baseline.json ] && [ "$BRANCH" != "main" ]; then mode=first; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "compare" ]; then node .github/health/visual.mjs; else node .github/health/visual.mjs --update; fi
          code=$?
          [ -f visual-summary.md ] && cat visual-summary.md >> "$GITHUB_STEP_SUMMARY"
          [ "$mode" != "compare" ] && printf '## 시각 회귀 — %s\n\n기준 그림을 이 실행에서 썼다(견주기 없음) · 종료 코드 %s · 커밋은 다음 단계\n' "$([ "$mode" = first ] && echo '첫 기준' || echo '기준 갱신')" "$code" >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-out
          path: |
            visual-out/
            visual-result.json
            visual-summary.md
            .github/health/visual/baseline/
            .github/health/visual/baseline.json
          if-no-files-found: ignore
          retention-days: 14
      - name: 기준 커밋(첫 기준 · update=true)
        if: steps.run.outputs.mode != 'compare' && steps.run.outputs.code == '0'
        env:
          ACTOR: ${{ github.actor }}
          MODE: ${{ steps.run.outputs.mode }}
        run: |
          set -euo pipefail
          rm -f .github/health/node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/health/visual/baseline .github/health/visual/baseline.json
          if git diff --cached --quiet; then echo "기준 그림 바뀐 것 없음"; exit 0; fi
          what=$([ "$MODE" = first ] && echo '첫 기준' || echo '기준 갱신')
          git commit -m "시각 회귀 ${what} — ${ACTOR} · $(date -u +%Y-%m-%dT%H:%MZ) · ${RUN_URL}"
          git push origin "HEAD:${BRANCH}"
      # 🔵 2026-11-11(우편함 「코드·운영 — 0장 여섯 …」 4 · #966 회신 ⑦ 2) — 기준 커밋 뒤 같은 실행에서 견주기를 한 번 더 돌린다.
      #    러너(GITHUB_TOKEN)가 민 커밋은 PR 실행을 다시 돌리지 않거나(action_required) 사람 손을 기다렸다 — 그래서 새 head 에 초록이 없었다.
      #    방금 쓴 기준으로 견준 결과를 새 head 커밋 상태(context 「Visual (갱신 뒤 견주기)」)로 남긴다 — 사람 손 없이 PR 에 결과가 보인다.
      - name: 갱신 뒤 견주기(같은 실행)
        if: steps.run.outputs.mode != 'compare' && steps.run.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ln -sfn "$RUNNER_TEMP/pw/node_modules" "$GITHUB_WORKSPACE/.github/health/node_modules"
          node .github/health/visual.mjs
          code=$?
          rm -f .github/health/node_modules
          sha=$(git rev-parse HEAD)
          state=$([ "$code" = "0" ] && echo success || echo failure)
          desc=$([ "$code" = "0" ] && echo '갱신한 기준과 같음(40장)' || echo "갱신 뒤 견주기 실패(code=$code)")
          [ -f visual-summary.md ] && { printf '\n## 갱신 뒤 견주기\n\n'; cat visual-summary.md; } >> "$GITHUB_STEP_SUMMARY"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${sha}" -f state="$state" -f context='Visual (갱신 뒤 견주기)' \
            -f description="$desc" -f target_url="$RUN_URL" >/dev/null || echo "::warning::커밋 상태를 남기지 못함"
          [ "$code" = "0" ] || { echo "::error::갱신 뒤 견주기 실패(code=$code)"; exit 1; }
      - name: 판정
        run: |
          code='${{ steps.run.outputs.code }}'
          [ "$code" = "0" ] || { echo "::error::시각 회귀 실패(code=$code) — 요약·아티팩트 visual-out 의 차이 그림을 본다"; exit 1; }
