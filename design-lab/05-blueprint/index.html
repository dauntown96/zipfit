.phone{position:relative;width:100%;max-width:390px;height:100dvh;max-height:844px;overflow:hidden;background:

.dr{stroke-dasharray:1;stroke-dashoffset:1}

.lb{opacity:0}
.ready .screen.on .lb{animation:lb .5s ease forwards;animation-delay:calc(var(--d,0)*1ms)}

.top{display:flex;justify-content:space-between;align-items:center;padding:16px 2px 10px;border-bottom:1.5px solid var(--ink)}

.sum{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--ink)}
.sum div{padding:9px 6px;border-right:1px solid var(--grid2)}
.sum div:last-child{border-right:0}
.sum .k{font-size:10px;color:var(--mute);letter-spacing:.04em}
.sum .v{font-size:20px;font-weight:600}
.sum .v.red{color:var(--red)}
.cap{font-size:10.5px;letter-spacing:.12em;color:var(--mute);margin:16px 2px 8px;display:flex;justify-content:space-between}
/* 도면 시트 카드 */
.sheet{background:rgba(255,255,255,.72);border:1.5px solid var(--ink);margin-bottom:12px;cursor:pointer;position:relative}
.sheet .body{display:grid;grid-template-columns:118px 1fr;min-height:132px}
.sheet .plan{border-right:1px solid var(--ink);display:grid;place-items:center;padding:6px}
.sheet .plan svg{width:106px;height:118px;overflow:visible}

.tb{display:grid;grid-template-columns:1fr 1fr 74px;border-top:1px solid var(--ink);font-size:10.5px}
.tb>div{padding:5px 8px;border-right:1px solid var(--ink)}.tb>div:last-child{border-right:0}
.tb .k{color:var(--mute);font-size:9.5px;letter-spacing:.06em}

.pin svg{width:16px;height:16px}
.pin path{fill:none;stroke:var(--ink);stroke-width:1.6;transition:fill .3s}
.pin.is-on{background:var(--red);border-color:var(--red)}.pin.is-on path{stroke:#fff;fill:#fff}
.ready .screen.on .sheet{animation:sh .6s var(--out) both;animation-delay:calc(var(--i)*120ms)}

@keyframes zo{to{opacity:0;transform:scale(1.06)}}@keyframes zi{from{opacity:0;transform:scale(.97)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.dr{stroke-dashoffset:0}.lb{opacity:1}}

function route(name, opts = {}) {
  const run = () => {
    $$('.screen').forEach(s => s.classList.toggle('on', s.dataset.screen === name));
    document.documentElement.dataset.route = name;
    const sc = $(`.screen[data-screen="${name}"]`); if (sc) sc.scrollTop = 0;
    if (typeof onRoute === 'function') onRoute(name);
  };
  if (opts.instant) run(); else (typeof customSwap === 'function' ? customSwap(run, name) : swap(run));
  if (!opts.noHash) history.replaceState(null, '', name === 'detail' ? '#detail' : '#home');
}
function boot() {
  if (typeof render === 'function') render();
  $$('[data-open]').forEach(el => el.addEventListener('click', e => { if (e.target.closest('[data-fav]')) return; route('detail'); }));
  $$('[data-back]').forEach(el => el.addEventListener('click', () => route('home')));
  $$('[data-fav]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); el.classList.toggle('is-on'); el.setAttribute('aria-pressed', el.classList.contains('is-on')); }));
  $$('[data-toggle]').forEach(el => el.addEventListener('click', () => { const g = el.closest('[data-group]'); g.classList.toggle('is-open'); el.setAttribute('aria-expanded', g.classList.contains('is-open')); }));
  route(location.hash === '#detail' ? 'detail' : 'home', { instant: true, noHash: true });
  requestAnimationFrame(() => document.documentElement.classList.add('ready'));
}
// 숫자 올라가기(동작 줄이기면 바로 끝값)
function countUp(el, to, ms = 900) {
  if (RM) { el.textContent = to.toLocaleString('ko-KR'); return; }
  const t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0) / ms); const e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e).toLocaleString('ko-KR'); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// 평면 비교 — 한 변을 √면적에 비례시킨다(모양은 정사각형 가정: 원문 평면이 아니라 크기 비교용)
const maxA = Math.max(...ZF.cards.map(c => c.areaMax));
function miniPlan(c, i) {
  const s = a => 84 * Math.sqrt(a / maxA);
  const big = s(c.areaMax), sm = s(c.areaMin), x0 = 10, y0 = 112;
  return `<svg viewBox="0 0 106 124" ${i === 0 ? 'style="view-transition-name:plan"' : ''}>
    <rect class="dr" pathLength="1" x="${x0}" y="${y0 - big}" width="${big}" height="${big}" fill="none" stroke="#1B2B4B" stroke-width="1.6" style="--d:${300 + i * 120}"/>
    <rect class="dr" pathLength="1" x="${x0}" y="${y0 - sm}" width="${sm}" height="${sm}" fill="rgba(224,72,62,.08)" stroke="#E0483E" stroke-width="1.6" style="--d:${700 + i * 120}"/>
    <path class="dr" pathLength="1" d="M${x0} ${y0 + 6}H${x0 + big}M${x0} ${y0 + 3}v6M${x0 + big} ${y0 + 3}v6" stroke="#1B2B4B" stroke-width=".8" fill="none" style="--d:${900 + i * 120}"/>
    <text class="lb mono" x="${x0 + big / 2}" y="${y0 - big - 4}" font-size="8" text-anchor="middle" fill="#1B2B4B" style="--d:${1200 + i * 120}">${area(c.areaMax)}㎡</text>
    <text class="lb mono" x="${x0 + sm / 2}" y="${y0 - sm / 2 + 3}" font-size="8" text-anchor="middle" fill="#E0483E" style="--d:${1300 + i * 120}">${area(c.areaMin)}</text>
  </svg>`;
}
function render() {
  $('#asof').innerHTML = `${ymd(ZF.asOf)}<br>단위 원 · ㎡`;
  $('#sOpen').textContent = ZF.openCount; $('#sRecv').textContent = ZF.receivingCount;
  $('#tabs').innerHTML = TABS.map(([t], i) => `<a href="#" class="${i ? '' : 'on'}"><span class="mono">A-0${i + 1}</span>${t}</a>`).join('');
  $('#cards').innerHTML = ZF.cards.map((c, i) => {
    const p = phase(c);
    return `<article class="sheet" style="--i:${i}" ${i === 0 ? 'data-open' : ''}>
      <button class="pin" data-fav aria-pressed="false" aria-label="관심"><svg viewBox="0 0 16 16"><path d="M8 14.5S2 10.8 2 6.3A3.2 3.2 0 0 1 8 4.6a3.2 3.2 0 0 1 6 1.7c0 4.5-6 8.2-6 8.2z"/></svg></button>
      <div class="body"><div class="plan">${miniPlan(c, i)}</div>
      <div class="info"><div class="ty">${c.type.toUpperCase()}</div><h3>${c.name}</h3><div class="where">${c.sido} ${c.sigungu}</div>
      <div class="money mono">보증금 <b>${won(c.depMin)}</b>~<br>월 <b>${won(c.rentMin)}</b>~</div></div></div>
      <div class="tb"><div><div class="k">접수 시작</div><div class="v mono">${mdw(c.applyStart)}</div></div><div><div class="k">접수 마감</div><div class="v mono">${mdw(c.applyEnd)}</div></div><div class="dd ${p.key}"><div class="k">${p.dLabel}</div><div class="v mono">${dd(p.d)}</div></div></div>
    </article>`;
  }).join('');
  const d = ZF.detail, p = phase(d), g = d.group;
  $('#dno').innerHTML = `SHEET A-01<br>${d.aid}`;
  // 평형 겹쳐 보기 — 세대 정보 행의 형(type)마다 한 변 ∝ √전용면적
  const types = [{ type: g.type, area: g.area, on: true }, ...d.others.map(o => ({ type: o.type, area: o.area }))]
    .filter((t, i, a) => a.findIndex(u => u.type === t.type) === i).sort((a, b) => b.area - a.area);
  const W = 362, base = 196, mx = Math.max(...types.map(t => t.area)), side = a => 150 * Math.sqrt(a / mx);
  const plan = types.map((t, i) => { const s = side(t.area); return `<rect class="dr" pathLength="1" x="24" y="${base - s}" width="${s}" height="${s}" fill="${t.on ? 'rgba(224,72,62,.10)' : 'none'}" stroke="${t.on ? '#E0483E' : '#1B2B4B'}" stroke-width="${t.on ? 2.2 : 1}" ${t.on ? '' : 'stroke-dasharray="1"'} style="--d:${200 + i * 150}"/>`; }).join('');
  const sOn = side(g.area), sMax = side(mx);
  const dims = `<path class="dr" pathLength="1" d="M24 ${base + 10}H${24 + sMax}M24 ${base + 5}v10M${24 + sMax} ${base + 5}v10" stroke="#1B2B4B" stroke-width=".9" fill="none" style="--d:1100"/>
    <text class="lb mono" x="${24 + sMax / 2}" y="${base + 24}" font-size="10" text-anchor="middle" fill="#1B2B4B" style="--d:1400">최대 ${area(mx)}㎡</text>
    <path class="dr" pathLength="1" d="M${24 + sOn} ${base - sOn / 2}L${206} ${base - 118}H${W - 10}" stroke="#E0483E" stroke-width="1" fill="none" style="--d:1300"/>
    <circle cx="${24 + sOn}" cy="${base - sOn / 2}" r="2.6" fill="#E0483E" class="lb" style="--d:1300"/>
    <text class="lb" x="${210}" y="${base - 124}" font-size="13" font-weight="700" fill="#E0483E" style="--d:1500">${g.type} · 전용 ${area(g.area)}㎡</text>
    <text class="lb" x="${210}" y="${base - 102}" font-size="11" fill="#1B2B4B" style="--d:1600">이 형 ${g.total}세대 / 총 ${d.totalUnits}세대</text>
    <text class="lb mono" x="${210}" y="${base - 72}" font-size="10" fill="#6A7890" style="--d:1700">한 변 ∝ √면적</text>
    <text class="lb mono" x="${210}" y="${base - 58}" font-size="10" fill="#6A7890" style="--d:1700">평면 모양은 원문 참조</text>`;
  // 일정 치수선 — 날짜 사이 실제 일수
  const pts = [['공고', d.annDate], ['접수', d.applyStart], ['마감', d.applyEnd], ['서류', d.docStart], ['발표', d.winner]];
  const xs = [14, 96, 150, 222, 326];
  const chain = pts.map(([k, v], i) => `<line class="dr" pathLength="1" x1="${xs[i]}" y1="22" x2="${xs[i]}" y2="44" stroke="${k === '접수' || k === '마감' ? '#E0483E' : '#1B2B4B'}" stroke-width="1.2" style="--d:${300 + i * 120}"/>
      <text class="lb" x="${xs[i]}" y="58" font-size="10.5" font-weight="700" text-anchor="middle" fill="#1B2B4B" style="--d:${600 + i * 120}">${k}</text>
      <text class="lb mono" x="${xs[i]}" y="71" font-size="9.5" text-anchor="middle" fill="#6A7890" style="--d:${600 + i * 120}">${k === '발표' ? ymd(v).slice(2) : md(v)}</text>`).join('') +
    pts.slice(1).map(([k, v], i) => `<text class="lb mono" x="${(xs[i] + xs[i + 1]) / 2}" y="28" font-size="9.5" text-anchor="middle" fill="${i === 1 ? '#E0483E' : '#1B2B4B'}" style="--d:${900 + i * 100}">${dayDiff(pts[i][1], v)}일</text>`).join('') +
    `<path class="dr" pathLength="1" d="M14 33H326" stroke="#1B2B4B" stroke-width=".9" fill="none" style="--d:150"/>
     <path d="M${14 + (96 - 14) * (dayDiff(d.annDate, ZF.asOf) / dayDiff(d.annDate, d.applyStart))} 14l-5 -8h10z" fill="#2A8DD8" class="lb" style="--d:1500"/>
     <text class="lb" x="${14 + (96 - 14) * (dayDiff(d.annDate, ZF.asOf) / dayDiff(d.annDate, d.applyStart))}" y="5" font-size="0"></text>`;
  $('#detail').innerHTML = `
    <div class="dtitle"><div class="ty">${d.type} · ${d.org} <span class="st">${p.label} ${dd(p.d)}</span></div><h1>${d.title}</h1><p>${d.address} · ${d.heating} · 입주 ${d.moveIn}</p></div>
    <div class="drawing"><span class="lab mono">PLAN · 평형 겹쳐 보기</span><svg viewBox="0 0 ${W} 228" style="view-transition-name:plan">${plan}${dims}</svg>
      <div class="legend">${types.map(t => `<span class="${t.on ? 'on' : ''}"><i></i>${t.type} ${area(t.area)}㎡</span>`).join('')}</div></div>
    <div class="money2"><div><div class="k">임대보증금</div><div class="v mono">${won(d.depMin)}</div><div class="t mono">~ ${won(d.depMax)}</div></div><div><div class="k">월 임대료</div><div class="v mono">${won(d.rentMin)}</div><div class="t mono">~ ${won(d.rentMax)}</div></div></div>
    <div class="chain"><div class="lab2 mono">SCHEDULE · 일정 치수선 (▼ 오늘)</div><svg viewBox="0 0 354 78" style="width:100%;height:auto;display:block;overflow:visible">${chain}</svg></div>
    <div class="group is-open" data-group><button class="gh" data-toggle aria-expanded="true"><span><b>${g.type}</b> <span style="font-size:12px;color:var(--mute)">전용 ${area(g.area)}㎡</span></span><span><span class="n mono">${g.total}세대</span> <span class="pm">＋</span></span></button>
      <div class="rows"><div>${g.rows.map(r => `<div class="r"><span>${r.target}</span><span class="c mono">${r.count != null ? r.count + '세대' : '공동'}</span><span class="p mono">보증금 ${won(r.dep)} · 월 ${won(r.rent)}</span></div>`).join('')}<div class="note">공동 = 대학생·청년(소득無)과 청년(소득有)이 ${g.shared}세대를 함께 모집</div></div></div></div>
    <div class="site"><svg viewBox="0 0 360 150" style="width:100%;height:100%"><circle cx="320" cy="32" r="16" fill="none" stroke="#1B2B4B"/><path d="M320 18l5 18-5-4-5 4z" fill="#1B2B4B"/><rect class="dr" pathLength="1" x="150" y="50" width="70" height="44" fill="rgba(224,72,62,.08)" stroke="#E0483E" stroke-width="1.6" style="--d:300"/></svg><span>지도 자리 · ${d.address}</span></div>`;
}
function onRoute(name) {
  $$(`.screen[data-screen="${name}"] .dr, .screen[data-screen="${name}"] .lb, .screen[data-screen="${name}"] .sheet`).forEach(el => { el.style.animation = 'none'; el.getBoundingClientRect(); el.style.animation = ''; });
}
boot();
</script>
</body>
</html>
