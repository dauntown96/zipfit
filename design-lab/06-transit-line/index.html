.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 10px}

const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const d8 = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const dayDiff = (a, b) => Math.round((d8(b) - d8(a)) / 864e5);
// 2,886만원 · 3,270만 8,000원 · 1억 7,480만원 · 14만 6,700원 — 반올림 없이 그대로 쓴다
function won(w) {
  if (w == null) return '—';
  const eok = Math.floor(w / 1e8), man = Math.floor((w % 1e8) / 1e4), rest = w % 1e4;
  const p = [];
  if (eok) p.push(eok + '억');
  if (man) p.push(man.toLocaleString('ko-KR') + '만');
  if (rest) p.push(rest.toLocaleString('ko-KR'));
  return p.join(' ') + '원';
}
const md = s => { if (!s) return '—'; const d = d8(s); return `${d.getUTCMonth() + 1}.${d.getUTCDate()}`; };
const mdw = s => { if (!s) return '—'; const d = d8(s); return `${d.getUTCMonth() + 1}.${d.getUTCDate()}(${WD[d.getUTCDay()]})`; };
const ymd = s => s ? s.replace(/-/g, '.') : '—';
const area = n => (Math.round(n * 100) / 100).toString();
// 오늘(ZF.asOf) 기준 접수 상태 — 시작 전 / 접수 중 / 끝
function phase(c) {
  const t = ZF.asOf;
  if (t < c.applyStart) return { key: 'soon', label: '접수 예정', short: '예정', d: dayDiff(t, c.applyStart), dLabel: '접수까지' };
  if (t <= c.applyEnd) return { key: 'open', label: '접수중', short: '접수중', d: dayDiff(t, c.applyEnd), dLabel: '마감까지' };
  return { key: 'closed', label: '접수 마감', short: '마감', d: 0, dLabel: '' };
}
const dd = n => n === 0 ? 'D-DAY' : `D-${n}`;
const TABS = [['추천', 'rec'], ['공고', 'list'], ['인사이트', 'ins'], ['관리', 'mng'], ['설정', 'set']];
// 화면 전환 — View Transitions가 있으면 쓰고, 없거나 동작 줄이기면 바로 바꾼다
function swap(fn) {
  if (!RM && document.startViewTransition) document.startViewTransition(fn); else fn();
}
function route(name, opts = {}) {
  const run = () => {
    $$('.screen').forEach(s => s.classList.toggle('on', s.dataset.screen === name));
    document.documentElement.dataset.route = name;
    const sc = $(`.screen[data-screen="${name}"]`); if (sc) sc.scrollTop = 0;
    if (typeof onRoute === 'function') onRoute(name);
  };
  if (opts.instant) run(); else (typeof customSwap === 'function' ? customSwap(run, name) : swap(run));
  if (!opts.noHash) history.replaceState(null, '', name === 'detail' ? '#detail' : '#home');
}
function boot() {
  if (typeof render === 'function') render();
  $$('[data-open]').forEach(el => el.addEventListener('click', e => { if (e.target.closest('[data-fav]')) return; route('detail'); }));
  $$('[data-back]').forEach(el => el.addEventListener('click', () => route('home')));
  $$('[data-fav]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); el.classList.toggle('is-on'); el.setAttribute('aria-pressed', el.classList.contains('is-on')); }));
  $$('[data-toggle]').forEach(el => el.addEventListener('click', () => { const g = el.closest('[data-group]'); g.classList.toggle('is-open'); el.setAttribute('aria-expanded', g.classList.contains('is-open')); }));
  route(location.hash === '#detail' ? 'detail' : 'home', { instant: true, noHash: true });
  requestAnimationFrame(() => document.documentElement.classList.add('ready'));
}
// 숫자 올라가기(동작 줄이기면 바로 끝값)
function countUp(el, to, ms = 900) {
  if (RM) { el.textContent = to.toLocaleString('ko-KR'); return; }
  const t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0) / ms); const e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e).toLocaleString('ko-KR'); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// 유형마다 노선 색 하나(행복주택·국민임대·공공임대) — 실제 반영 때는 유형 표 전체로 늘린다
const LINE = { '행복주택': ['#00A651', '행'], '국민임대': ['#0067B3', '국'], '10년 분양전환 공공임대': ['#8B50A4', '공'] };
function stations(c) {
  return [['공고', c.annDate], ['접수', c.applyStart], ['마감', c.applyEnd], ['발표', c.winner]].filter(s => s[1]);
}
function render() {
  $('#asof').textContent = ymd(ZF.asOf) + ' 기준';
  $('#bOpen').textContent = ZF.openCount; $('#bRecv').textContent = ZF.receivingCount;
  $('#tabs').innerHTML = TABS.map(([t], i) => `<a href="#" class="${i ? '' : 'on'}"><i></i>${t}</a>`).join('');
  const ord = ZF.cards.map((c, i) => ({ c, i, p: phase(c) })).sort((a, b) => a.p.d - b.p.d);
  $('#board').innerHTML = ord.map(({ c, p }, j) => {
    const [col, ch] = LINE[c.type];
    const txt = (p.key === 'open' ? '마감' : '접수') + String(p.d).padStart(2, ' ') + '일';
    return `<div class="brow"><span class="badge" style="--c:${col}">${ch}</span><span class="nm">${c.name}</span><span class="flap">${[...txt].map((ch2, k) => `<span style="--k:${j * 5 + k}">${ch2 === ' ' ? '&nbsp;' : ch2}</span>`).join('')}</span></div>`;
  }).join('');
  $('#routes').innerHTML = ZF.cards.map((c, i) => {
    const [col, ch] = LINE[c.type], p = phase(c), ss = stations(c);
    const t0 = d8(ss[0][1]), t1 = d8(ss[ss.length - 1][1]);
    // 역 간격은 날짜에 비례하되, 너무 붙지 않게 순서 간격과 반씩 섞는다
    const pos = ss.map(([, v], k) => 50 * ((d8(v) - t0) / (t1 - t0)) + 50 * (k / (ss.length - 1)));
    const now = d8(ZF.asOf); let tp = 0;
    for (let k = 0; k < ss.length - 1; k++) { const a = d8(ss[k][1]), b = d8(ss[k + 1][1]); if (now >= a && now <= b) tp = pos[k] + (pos[k + 1] - pos[k]) * ((now - a) / (b - a || 1)); }
    return `<article class="route" style="--c:${col};--i:${i}" ${i === 0 ? 'data-open' : ''}>
      <div class="hd"><span class="badge">${ch}</span><div><div class="ty">${c.type} · ${c.sido} ${c.sigungu}</div><h3>${c.name}</h3></div></div>
      <span class="dd">${p.dLabel} ${dd(p.d)}</span>
      <button class="star" data-fav aria-pressed="false" aria-label="즐겨찾기"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></button>
      <div class="px">보증금 <b>${won(c.depMin)}</b>~ · 월 <b>${won(c.rentMin)}</b>~</div>
      <div class="track"><div class="ln" style="--p:${tp / 100}"><i></i></div>
        ${ss.map(([k, v], j) => `<span class="st ${v <= ZF.asOf ? 'past' : ''}" style="left:calc(6px + (100% - 12px) * ${pos[j] / 100})"><b>${k}</b><em>${md(v)}</em></span>`).join('')}
        <span class="train" style="left:calc(6px + (100% - 12px) * ${tp / 100})"></span></div>
    </article>`;
  }).join('');
  const d = ZF.detail, p = phase(d), g = d.group, [col, ch] = LINE[d.type];
  const vs = [['공고', ymd(d.annDate), d.annDate], ['NOW'], ['청약 접수', `${mdw(d.applyStart)} ~ ${mdw(d.applyEnd)}`, d.applyStart, 1], ['서류 제출', `${md(d.docStart)} ~ ${md(d.docEnd)}`, d.docStart], ['당첨 발표', ymd(d.winner), d.winner], ['계약', ymd(d.contractStart), d.contractStart], ['입주', d.moveIn, '9999']];
  $('#detail').innerHTML = `
    <div class="dtop" style="--c:${col}"><button data-back aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><span class="ty"><span class="badge" style="width:20px;height:20px;font-size:10px">${ch}</span>${d.type} · ${d.org}</span></div>
    <div class="sign" style="--c:${col}">
      <div class="main"><span class="st2">${p.label}</span><h1>${d.name}</h1><div class="sub">${d.address} · 총 ${d.totalUnits}세대</div></div>
      <div class="bar"><div><span>← 공고</span><small>${mdw(d.annDate)}</small></div><span class="now">지금</span><div class="nx"><span>접수 →</span><small>${mdw(d.applyStart)} · ${dd(p.d)}</small></div></div>
    </div>
    <div class="fare"><div><div class="k">임대보증금</div><div class="v n">${won(d.depMin)}</div><div class="t n">~ ${won(d.depMax)}</div></div><div><div class="k">월 임대료</div><div class="v n">${won(d.rentMin)}</div><div class="t n">~ ${won(d.rentMax)}</div></div></div>
    <div class="group is-open" data-group style="--c:${col}"><button class="gh" data-toggle aria-expanded="true"><span><b>${g.type}</b> <span style="font-size:12px;color:var(--mute)">전용 ${area(g.area)}㎡</span></span><span style="display:flex;align-items:center"><span class="cnt">${g.total}세대</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span></button>
      <div class="rows"><div>${g.rows.map(r => `<div class="r"><span>${r.target}</span><span class="c">${r.count != null ? r.count + '세대' : '함께 ' + g.shared}</span><span class="p n">보증금 ${won(r.dep)} · 월 ${won(r.rent)}</span></div>`).join('')}
      <div class="note">대학생·청년(소득無)과 청년(소득有)은 ${g.shared}세대를 함께 모집</div></div></div></div>
    <div class="vmap" style="--c:${col}"><div class="vl"><i></i></div>
      ${vs.map(v => v[0] === 'NOW' ? `<div class="vs now"><span class="here"></span><b>지금 ${md(ZF.asOf)} · 접수까지 ${p.d}일</b></div>` : `<div class="vs ${v[2] <= ZF.asOf ? 'past' : ''} ${v[3] ? 'hot' : ''}"><b>${v[0]}</b><span class="n">${v[1]}</span></div>`).join('')}</div>
    <div class="map"><svg viewBox="0 0 360 140" preserveAspectRatio="none"><path d="M-10 100C80 90 120 40 200 52S320 20 380 30" stroke="${col}" stroke-width="7" fill="none" stroke-linecap="round" opacity=".85"/><circle cx="200" cy="52" r="9" fill="#fff" stroke="${col}" stroke-width="4"/></svg><span>지도 자리 · ${d.address}</span></div>`;
}
function customSwap(run, name) { document.documentElement.dataset.dir = name === 'home' ? 'back' : 'fwd'; swap(run); }
function onRoute(name) {
  $$(`.screen[data-screen="${name}"] .route, .screen[data-screen="${name}"] .flap span, .screen[data-screen="${name}"] .ln i, .screen[data-screen="${name}"] .vl i, .screen[data-screen="${name}"] .here`).forEach(el => { el.style.animation = 'none'; el.offsetWidth; el.style.animation = ''; });
}
boot();
</script>
</body>
</html>
